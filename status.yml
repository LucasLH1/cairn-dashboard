# Avancement de Cairn Dashboard
#
# Source unique du découpage en tranches. L'état d'une tranche ne reflète que
# ce qui existe réellement, dans le dépôt et en production. Rien n'est extrapolé.
#
# Les tranches se livrent dans l'ordre de ce fichier, une à la fois, en
# découpage vertical : chacune est utilisable de bout en bout, en ligne, avant
# que la suivante commence (CLAUDE.md, règle 6).
#
# États possibles, dans l'ordre du cycle de vie :
#
#   à faire            la tranche est identifiée, rien n'est réalisé
#   en développement   la réalisation est engagée
#   livré              la tranche est utilisable de bout en bout, en production
#                      sur main
#
# Aucune tranche n'est aujourd'hui « en développement » ni « livré » : le dépôt
# ne contient aucun code applicatif.
#
# Les identifiants sont des chaînes, entre guillemets : « 1a » n'est pas un
# nombre, et toutes les tranches gardent la même forme. Le champ « issue »
# renvoie à l'issue GitHub qui porte la tranche ; le champ « label », au label
# GitHub qui la marque.
#
# À tenir à jour à chaque session, en même temps que journal/ et les issues.

projet: Cairn Dashboard
mis_a_jour_le: 2026-09-15

tranches:

  - id: "1a"
    nom: Squelette Nuxt, thème et composants du design, CI, mise en ligne
    etat: à faire
    issue: 1
    label: tranche/1a-squelette

