# Contrôles bloquants — docs/deploiement.md §1 et §3.
# Le workflow appelle des scripts à noms fixes et ne connaît pas la pile.
name: qualité

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  controles:
    name: Contrôles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Le verrou dépend de la version de npm qui l'écrit : on prend celle que le
      # dépôt déclare, pour que poste et intégration résolvent à l'identique.
      - name: Fixer la version de npm, celle du dépôt
        run: |
          V=$(node -p "require('./package.json').packageManager.split('@')[1]")
          npm install -g "npm@$V"
          npm --version

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Contrôles statiques
        run: scripts/ci/lint

      - name: Tests
        run: scripts/ci/test
