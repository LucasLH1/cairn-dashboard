# Construction, épreuve et publication de l'image — docs/deploiement.md §1 et §3.
# Sur dev uniquement : l'image est étiquetée par le SHA du commit, jamais par une
# étiquette mouvante, et n'est publiée qu'une fois éprouvée.
name: image

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  construire:
    name: Construire, éprouver, publier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Calculer le nom de l'image, en minuscules
        id: nom
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Le verrou dépend de la version de npm qui l'écrit : on prend celle que le
      # dépôt déclare, pour que poste et intégration résolvent à l'identique.
      - name: Fixer la version de npm, celle du dépôt
        run: |
          V=$(node -p "require('./package.json').packageManager.split('@')[1]")
          npm install -g "npm@$V"
          npm --version

      - name: Installer les dépendances, pour le test de fumée
        run: npm ci --no-audit --no-fund

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image, étiquetée par le SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.nom.outputs.image }}:${{ github.sha }}
          build-args: APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Éprouver l'image
        env:
          NUXT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUXT_GITHUB_REPO: ${{ github.repository }}
        run: scripts/ci/smoke "${{ steps.nom.outputs.image }}:${{ github.sha }}" "${{ github.sha }}"

      - name: Se connecter au registre
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image éprouvée
        run: docker push "${{ steps.nom.outputs.image }}:${{ github.sha }}"

      - name: Récapitulatif
        run: |
          {
            echo "### Image publiée"
            echo
            echo '`${{ steps.nom.outputs.image }}:${{ github.sha }}`'
          } >> "$GITHUB_STEP_SUMMARY"
